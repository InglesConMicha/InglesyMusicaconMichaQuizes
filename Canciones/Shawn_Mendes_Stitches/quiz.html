<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Stitches · Shawn Mendes 🎵</title>
  <meta name="description" content="Pon a prueba tu inglés con la canción Stitches de Shawn Mendes. Vocabulario, gramática, pronunciación y más.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2.5'%3E%3Cpath d='M9 18V5l12-2v13'%3E%3C/path%3E%3Ccircle cx='6' cy='18' r='3' fill='%2338bdf8'%3E%3C/circle%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #060b14;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --card: rgba(10, 20, 40, 0.85);
      --border: rgba(0, 212, 255, 0.15);
      --text: #f0f9ff;
      --muted: #64748b;
      --lives: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === PARTICLES CANVAS === */
    #particles-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* === CONFETTI CANVAS === */
    #confetti-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 999;
    }

    /* === MAIN LAYOUT === */
    .page-wrapper {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    /* === HERO COVER === */
    .hero-cover {
      width: 100%; max-width: 740px;
      height: 200px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0,212,255,0.25);
    }

    .hero-cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }

    .hero-cover-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(6,11,20,0.9) 0%, rgba(6,11,20,0.4) 60%, transparent 100%);
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 28px;
    }

    .hero-song-label {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px;
    }

    .hero-song-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem; font-weight: 900;
      color: #fff; line-height: 1.1;
      text-shadow: 0 2px 20px rgba(0,212,255,0.4);
    }

    .hero-song-artist {
      font-size: 1rem; font-weight: 600;
      color: rgba(255,255,255,0.65); margin-top: 4px;
    }

    /* === QUIZ CARD === */
    .quiz-card {
      width: 100%; max-width: 740px;
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,212,255,0.05), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    .quiz-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), var(--accent2), transparent);
    }

    /* === STATUS BAR === */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; gap: 8px; flex-wrap: wrap;
    }

    .lives-display {
      display: flex; gap: 4px; align-items: center;
    }

    .heart {
      font-size: 1.3rem;
      transition: transform 0.3s ease, opacity 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(239,68,68,0.7));
    }

    .heart.lost {
      opacity: 0.2;
      filter: none;
      transform: scale(0.8);
    }

    .badge {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700;
    }

    .badge-streak {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
    }

    .badge-xp {
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.25);
      color: #fbbf24;
    }

    .badge-combo {
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      color: #a78bfa;
      display: none;
    }

    /* === PROGRESS === */
    .progress-section {
      margin-bottom: 20px;
    }

    .progress-header {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%; height: 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent3), var(--accent), var(--accent2));
      border-radius: 6px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute; right: 0; top: 50%;
      transform: translateY(-50%);
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    /* === TIMER === */
    .timer-ring-wrap {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }

    .timer-ring-container {
      position: relative; width: 52px; height: 52px; flex-shrink: 0;
    }

    .timer-ring {
      transform: rotate(-90deg);
    }

    .timer-ring-bg {
      fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 4;
    }

    .timer-ring-fg {
      fill: none; stroke: var(--accent); stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 126;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
    }

    .timer-number {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem; font-weight: 800;
      color: var(--accent);
    }

    /* === AUDIO BUTTON === */
    .btn-audio {
      flex: 1;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.2);
      color: var(--accent);
      padding: 10px 16px; border-radius: 12px;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      transition: all 0.2s ease;
    }

    .btn-audio:hover {
      background: rgba(0,212,255,0.15);
      border-color: rgba(0,212,255,0.4);
      transform: scale(1.02);
    }

    .btn-audio.playing {
      background: rgba(0,212,255,0.2);
      border-color: var(--accent);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.3); }
      50% { box-shadow: 0 0 0 6px rgba(0,212,255,0); }
    }

    /* === QUESTION AREA === */
    #quiz-area { flex: 1; }

    .question-card { display: flex; flex-direction: column; gap: 14px; }

    .category-chip {
      align-self: flex-start;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.25);
      color: var(--accent);
      padding: 3px 10px; border-radius: 8px;
      font-size: 0.7rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.1em;
    }

    .question-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.25rem; font-weight: 800;
      line-height: 1.4; color: #fff;
    }

    .context-verse {
      background: rgba(0,0,0,0.4);
      border-left: 3px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 12px 16px;
      font-size: 0.95rem; font-style: italic;
      color: rgba(240,249,255,0.8);
      line-height: 1.5;
    }

    .context-verse strong { color: var(--accent); font-style: normal; }

    /* === OPTIONS === */
    .options-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 10px; margin-top: 4px;
    }

    .option-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--text);
      padding: 14px 18px; border-radius: 14px;
      font-size: 0.95rem; font-weight: 600;
      text-align: left; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      font-family: 'Outfit', sans-serif;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      position: relative; overflow: hidden;
    }

    .option-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.05) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.2s;
    }

    .option-btn:hover:not(:disabled)::before { opacity: 1; }

    .option-btn:hover:not(:disabled) {
      background: rgba(0,212,255,0.08);
      border-color: rgba(0,212,255,0.3);
      transform: translateX(5px);
    }

    .option-letter {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 800;
      color: var(--accent); flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .option-btn.correct {
      background: rgba(16,185,129,0.12) !important;
      border-color: var(--success) !important;
      color: #6ee7b7 !important;
      transform: scale(1.01);
    }

    .option-btn.correct .option-letter {
      background: var(--success); color: #052e16;
    }

    .option-btn.incorrect {
      background: rgba(239,68,68,0.12) !important;
      border-color: var(--error) !important;
      color: #fca5a5 !important;
      animation: shake 0.4s ease;
    }

    .option-btn.incorrect .option-letter {
      background: var(--error); color: #450a0a;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* === HINT BUTTON === */
    .btn-hint {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      color: #fbbf24; border-radius: 10px;
      padding: 8px 14px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-hint:hover:not(:disabled) {
      background: rgba(245,158,11,0.15);
      transform: scale(1.02);
    }

    .btn-hint:disabled { opacity: 0.3; cursor: not-allowed; }

    /* === FEEDBACK BOX === */
    .feedback-box {
      margin-top: 12px; padding: 14px 16px;
      border-radius: 14px; font-size: 0.9rem; line-height: 1.6;
      display: none; animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .feedback-box.correct {
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.2);
      color: #6ee7b7; display: block;
    }

    .feedback-box.incorrect {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5; display: block;
    }

    .feedback-emoji { font-size: 1.6rem; display: block; margin-bottom: 6px; }

    /* === FLIP CARD VOCAB === */
    .vocab-flip-wrap {
      margin-top: 12px;
      perspective: 800px;
      display: none;
    }

    .vocab-flip-wrap.visible { display: block; animation: slideUp 0.4s ease; }

    .vocab-flip {
      width: 100%; height: 80px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer;
      border-radius: 12px;
    }

    .vocab-flip.flipped { transform: rotateY(180deg); }

    .vocab-face {
      position: absolute; inset: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 12px;
    }

    .vocab-face-front {
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.2);
      color: var(--accent);
      flex-direction: column; gap: 4px;
    }

    .vocab-face-back {
      background: rgba(124,58,237,0.1);
      border: 1px solid rgba(124,58,237,0.25);
      color: #a78bfa;
      transform: rotateY(180deg);
      text-align: center;
    }

    .vocab-hint-label {
      font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.1em; opacity: 0.6;
    }

    /* === FOOTER ACTIONS === */
    .footer-actions {
      display: flex; justify-content: space-between;
      align-items: center; margin-top: 20px; gap: 10px;
    }

    .btn-back {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      padding: 12px 18px; border-radius: 12px;
      font-size: 0.85rem; font-weight: 600;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Outfit', sans-serif;
      transition: all 0.2s ease;
    }

    .btn-back:hover { color: #fff; border-color: rgba(255,255,255,0.2); }

    .btn-next {
      background: linear-gradient(135deg, var(--accent3), var(--accent));
      color: #060b14; border: none;
      padding: 14px 28px; border-radius: 14px;
      font-size: 1rem; font-weight: 800;
      cursor: pointer; display: inline-flex;
      align-items: center; gap: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-shadow: 0 4px 20px rgba(0,212,255,0.3);
      transition: all 0.2s ease;
    }

    .btn-next:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,212,255,0.5);
    }

    .btn-next:disabled {
      opacity: 0.3; cursor: not-allowed;
      transform: none; box-shadow: none;
    }

    /* === RESULTS SCREEN === */
    .results-screen {
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      padding: 10px 0;
    }

    .medal-display { font-size: 5rem; animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1); }

    @keyframes bounce-in {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .results-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.8rem; font-weight: 900; color: #fff;
    }

    .score-ring {
      position: relative; width: 140px; height: 140px;
    }

    .score-ring svg { transform: rotate(-90deg); }

    .score-ring-number {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    .score-percent {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2.2rem; font-weight: 900;
      color: var(--accent);
    }

    .score-fraction { font-size: 0.75rem; color: var(--muted); font-weight: 600; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; width: 100%;
    }

    .stat-block {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 14px;
      text-align: center;
    }

    .stat-number {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.6rem; font-weight: 900;
      color: var(--accent);
    }

    .stat-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-top: 4px; }

    .results-message {
      color: rgba(240,249,255,0.7);
      font-size: 0.95rem; line-height: 1.6;
      max-width: 440px;
    }

    .results-buttons {
      display: flex; gap: 12px; flex-wrap: wrap;
      justify-content: center;
    }

    .btn-retry {
      background: transparent;
      border: 1px solid rgba(0,212,255,0.25);
      color: var(--accent);
      padding: 12px 22px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: rgba(0,212,255,0.1);
      border-color: var(--accent);
    }

    /* === GAME OVER SCREEN === */
    .gameover-screen {
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px; padding: 20px 0;
    }

    /* === FLOATING TOAST === */
    #toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(10,20,40,0.95);
      border: 1px solid var(--border);
      color: var(--text); border-radius: 14px;
      padding: 12px 24px; font-weight: 700; font-size: 0.95rem;
      z-index: 9999; backdrop-filter: blur(20px);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* === OPTION HINT ELIMINATED === */
    .option-btn.eliminated {
      opacity: 0.25;
      pointer-events: none;
      text-decoration: line-through;
    }

    /* === RESPONSIVE === */
    @media (max-width: 480px) {
      .hero-cover { height: 140px; }
      .hero-song-title { font-size: 1.4rem; }
      .question-text { font-size: 1.1rem; }
      .stats-grid { grid-template-columns: repeat(3,1fr); }
    }
  </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<div id="toast">Combo</div>

<div class="page-wrapper">

  <!-- HERO COVER -->
  <div class="hero-cover">
    <img src="cover.jpg" alt="Stitches - Shawn Mendes">
    <div class="hero-cover-overlay">
      <div class="hero-song-label">English Music Quiz</div>
      <div class="hero-song-title">Stitches</div>
      <div class="hero-song-artist">Shawn Mendes</div>
    </div>
  </div>

  <!-- QUIZ CARD -->
  <div class="quiz-card">

    <!-- STATUS BAR -->
    <div class="status-bar">
      <div class="lives-display" id="lives-display">
        <span class="heart" id="h1">❤️</span>
        <span class="heart" id="h2">❤️</span>
        <span class="heart" id="h3">❤️</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="badge badge-combo" id="combo-badge">x<span id="combo-mult">2</span></div>
        <div class="badge badge-streak"><span id="streak-count">0</span></div>
        <div class="badge badge-xp"><span id="xp-count">0</span> XP</div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-section">
      <div class="progress-header">
        <span id="progress-text">Pregunta 1 de 10</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- TIMER + AUDIO -->
    <div class="timer-ring-wrap">
      <div class="timer-ring-container">
        <svg class="timer-ring" width="52" height="52" viewBox="0 0 52 52">
          <circle class="timer-ring-bg" cx="26" cy="26" r="20"/>
          <circle class="timer-ring-fg" id="timer-ring-fg" cx="26" cy="26" r="20"/>
        </svg>
        <div class="timer-number" id="timer-number">30</div>
      </div>
      <button class="btn-audio" id="btn-audio" onclick="speakVerse()">
        Escuchar verso en inglés
      </button>
      <button class="btn-hint" id="btn-hint" onclick="useHint()">Pista <span style="opacity:0.6;font-size:0.7em">(-5 XP)</span></button>
    </div>

    <!-- QUIZ CONTENT -->
    <div id="quiz-area"></div>

    <!-- FOOTER -->
    <div class="footer-actions">
      <a href="../../index.html" class="btn-back">Catálogo</a>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>
        Continuar →
      </button>
    </div>

  </div>

</div>

<script>
// =============================================
//  QUESTIONS DATA
// =============================================
const questions = [
  {
    category: 'Vocabulario',
    question: '¿Qué significa la palabra "Stitches" en el título y coro?',
    verse: 'And now that I\'m without your kisses, I\'ll be needing stitches',
    image: null,

// =============================================
//  STATE
// =============================================
let currentIdx = 0;
let streak = 0;
let xp = 0;
let score = 0;
let lives = 3;
let hasAnswered = false;
let timerInterval = null;
let timeLeft = 30;
let hintUsed = false;
const TIMER_MAX = 30;
const circumference = 2 * Math.PI * 20; // r=20

// =============================================
//  DOM REFS
// =============================================
const quizArea     = document.getElementById('quiz-area');
const btnNext      = document.getElementById('btn-next');
const streakEl     = document.getElementById('streak-count');
const xpEl         = document.getElementById('xp-count');
const progressText = document.getElementById('progress-text');
const progressPct  = document.getElementById('progress-pct');
const progressFill = document.getElementById('progress-fill');
const timerFg      = document.getElementById('timer-ring-fg');
const timerNum     = document.getElementById('timer-number');
const comboBadge   = document.getElementById('combo-badge');
const comboMult    = document.getElementById('combo-mult');
const toastEl      = document.getElementById('toast');

// =============================================
//  AUDIO ENGINE (Web Speech + AudioContext)
// =============================================
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, volume = 0.15) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + duration);
}

function playCorrectSound() {
  playTone(523, 'sine', 0.15, 0.12);
  setTimeout(() => playTone(659, 'sine', 0.15, 0.12), 80);
  setTimeout(() => playTone(784, 'sine', 0.25, 0.12), 160);
}

function playWrongSound() {
  playTone(200, 'sawtooth', 0.15, 0.1);
  setTimeout(() => playTone(150, 'sawtooth', 0.25, 0.1), 100);
}

function playTimerAlarm() {
  playTone(880, 'square', 0.12, 0.08);
  setTimeout(() => playTone(440, 'square', 0.2, 0.1), 60);
}

function playFanfare() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.15), i * 100));
}

function speakVerse() {
  const q = questions[currentIdx];
  if (!q.verse) return;
  const btn = document.getElementById('btn-audio');
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(q.verse);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    utter.pitch = 1.05;
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('google')) ||
                    voices.find(v => v.lang.startsWith('en'));
    if (enVoice) utter.voice = enVoice;
    btn.classList.add('playing');
    btn.textContent = 'Reproduciendo...';
    utter.onend = () => { btn.classList.remove('playing'); btn.innerHTML = 'Escuchar verso en inglés'; };
    utter.onerror = () => { btn.classList.remove('playing'); btn.innerHTML = 'Escuchar verso en inglés'; };
    window.speechSynthesis.speak(utter);
  }
}

// =============================================
//  TIMER
// =============================================
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIMER_MAX;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 10) {
      timerFg.style.stroke = '#ef4444';
      if (timeLeft <= 5) playTimerAlarm();
    } else {
      timerFg.style.stroke = 'var(--accent)';
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeExpired();
    }
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

function updateTimerUI() {
  const pct = timeLeft / TIMER_MAX;
  const offset = circumference * (1 - pct);
  timerFg.style.strokeDashoffset = offset;
  timerNum.textContent = timeLeft;
  timerNum.style.color = timeLeft <= 10 ? '#ef4444' : 'var(--accent)';
}

function timeExpired() {
  if (hasAnswered) return;
  hasAnswered = true;
  const q = questions[currentIdx];
  playWrongSound();
  loseLife();
  streak = 0; streakEl.textContent = streak;
  comboBadge.style.display = 'none';
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${i}`);
    if (btn) {
      btn.disabled = true;
      if (i === q.correctIndex) btn.classList.add('correct');
    }
  });
  const fb = document.getElementById('feedback-box');
  if (fb) {
    fb.className = 'feedback-box incorrect';
    fb.innerHTML = `<b>Tiempo agotado</b><br>${q.explanation}`;
  }
  showVocabCard();
  btnNext.disabled = false;
  showToast('Tiempo agotado');
}

// =============================================
//  LIVES
// =============================================
function loseLife() {
  lives--;
  const heartEl = document.getElementById(`h${3 - lives}`);
  if (heartEl) heartEl.classList.add('lost');
  if (lives <= 0) {
    setTimeout(showGameOver, 700);
  }
}

function showGameOver() {
  stopTimer();
  quizArea.innerHTML = `
    <div class="gameover-screen">
      <div class="results-title">Sin vidas</div>
      <p class="results-message">Llegaste a la pregunta ${currentIdx + 1} de ${questions.length}.<br>¡Cada intento te hace más fuerte!</p>
      <div class="results-buttons">
        <button class="btn-next" onclick="restartQuiz()">Intentar de nuevo</button>
        <a href="../../index.html" class="btn-retry">Catálogo</a>
      </div>
    </div>`;
  btnNext.style.display = 'none';
}

// =============================================
//  RENDER QUESTION
// =============================================
function renderQuestion() {
  hasAnswered = false;
  hintUsed = false;
  btnNext.disabled = true;
  btnNext.style.display = 'inline-flex';

  const q = questions[currentIdx];
  const total = questions.length;
  const num = currentIdx + 1;
  const pct = Math.round(((num - 1) / total) * 100);

  progressText.textContent = `Pregunta ${num} de ${total}`;
  progressPct.textContent = `${pct}%`;
  progressFill.style.width = `${pct}%`;

  const letters = ['A','B','C','D'];
  const optHTML = q.options.map((opt, i) => `
    <button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">
      <span class="option-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>`).join('');

  quizArea.innerHTML = `
    <div class="question-card">
      <span class="category-chip">${q.category}</span>
      <div class="question-text">${q.question}</div>
      ${q.verse ? `<div class="context-verse">"${highlightVerse(q.verse)}"</div>` : ''}
      <div class="options-grid">${optHTML}</div>
      <div class="feedback-box" id="feedback-box"></div>
      <div class="vocab-flip-wrap" id="vocab-wrap">
        <div class="vocab-face vocab-face-front">
          <span class="vocab-hint-label">🔤 Tarjeta de vocabulario · Haz clic para girar</span>
          <span style="font-size:1.1rem;">${q.vocab.word}</span>
        </div>
      </div>
    </div>`;

  // Init vocab flip card (hidden initially)
  document.querySelector('.vocab-flip-wrap').style.display = 'none';

  const hintBtn = document.getElementById('btn-hint');
  hintBtn.disabled = false;

  startTimer();
}

function highlightVerse(verse) {
  // Bold key words in verse
  return verse.replace(/\b(stitches|knife|knees|gotta|breathe|breath|red|under|reap|sow|moth|flame|bleed|watch)\b/gi,
    w => `<strong>${w}</strong>`);
}

// =============================================
//  SELECT OPTION
// =============================================
function selectOption(selectedIdx) {
  if (hasAnswered) return;
  hasAnswered = true;
  stopTimer();

  const q = questions[currentIdx];
  const isCorrect = selectedIdx === q.correctIndex;
  const fb = document.getElementById('feedback-box');

  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add('correct');
    else if (i === selectedIdx && !isCorrect) btn.classList.add('incorrect');
  });

  if (isCorrect) {
    streak++;
    const multiplier = streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
    const earned = 15 * multiplier;
    xp += earned;
    score++;
    streakEl.textContent = streak;
    xpEl.textContent = xp;
    playCorrectSound();
    launchConfetti();

    if (streak >= 3) {
      comboBadge.style.display = 'flex';
      comboMult.textContent = multiplier;
    }

    const msgs = ['Perfecto', 'Excelente', 'Brillante', 'Increible', 'Correcto'];
    const msg = msgs[Math.min(streak - 1, msgs.length - 1)];
    fb.className = 'feedback-box correct';
    fb.innerHTML = `<b>${msg} — ${multiplier > 1 ? `+${earned} XP (x${multiplier} Combo)` : `+${earned} XP`}</b><br>${q.explanation}`;

    if (streak === 3) showToast('Racha x3 — Combo activado');
    if (streak === 5) showToast('Racha x5 — XP maximo x3');

  } else {
    streak = 0; streakEl.textContent = streak;
    comboBadge.style.display = 'none';
    playWrongSound();
    loseLife();

    const badMsgs = ['Casi', 'Sigue intentando', 'Aprende del error'];
    const msg = badMsgs[Math.floor(Math.random() * badMsgs.length)];
    fb.className = 'feedback-box incorrect';
    fb.innerHTML = `<b>${msg}</b><br>${q.explanation}`;
  }

  if (lives > 0) showVocabCard();
  btnNext.disabled = false;
}

function showVocabCard() {
  const q = questions[currentIdx];
  const wrap = document.getElementById('vocab-wrap');
  if (!wrap || !q.vocab) return;
  wrap.style.display = 'block';
  wrap.classList.add('visible');
  wrap.innerHTML = `
    <div class="vocab-flip" id="vocab-flip" onclick="this.classList.toggle('flipped')" title="Haz clic para girar">
      <div class="vocab-face vocab-face-front">
        <span class="vocab-hint-label">Tarjeta de vocabulario — clic para traducir</span>
        <span style="font-size:1.05rem;">${q.vocab.word}</span>
      </div>
      <div class="vocab-face vocab-face-back">
        <div>
          <div style="font-size:1rem;margin-bottom:6px;">${q.vocab.translation}</div>
          <div style="font-size:0.78rem;opacity:0.75;">${q.vocab.example}</div>
        </div>
      </div>
    </div>`;
}

// =============================================
//  HINT
// =============================================
function useHint() {
  if (hasAnswered || hintUsed) return;
  hintUsed = true;
  xp = Math.max(0, xp - 5);
  xpEl.textContent = xp;
  document.getElementById('btn-hint').disabled = true;
  showToast('Pista usada (-5 XP) — 2 opciones eliminadas');

  const q = questions[currentIdx];
  const wrong = [];
  q.options.forEach((_, i) => { if (i !== q.correctIndex) wrong.push(i); });
  // Shuffle and remove 2
  wrong.sort(() => Math.random() - 0.5);
  wrong.slice(0, 2).forEach(i => {
    const btn = document.getElementById(`opt-${i}`);
    if (btn) btn.classList.add('eliminated');
  });
}

// =============================================
//  NEXT QUESTION
// =============================================
function nextQuestion() {
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    renderQuestion();
  } else {
    showResults();
  }
}

// =============================================
//  RESULTS
// =============================================
function showResults() {
  stopTimer();
  playFanfare();
  progressText.textContent = 'Completado';
  progressPct.textContent = '100%';
  progressFill.style.width = '100%';

  const pct = Math.round((score / questions.length) * 100);
  let medal = '', msg = '';
  if (pct >= 90) { medal = 'S'; msg = 'Dominio absoluto. Entiendes cada verso, metáfora y regla gramatical.'; }
  else if (pct >= 70) { medal = 'A'; msg = 'Muy bien. Tienes una base sólida en las expresiones y el inglés de esta canción.'; }
  else if (pct >= 50) { medal = 'B'; msg = 'Buen esfuerzo. Escucha la canción mientras lees la letra para reforzar lo aprendido.'; }
  else { medal = 'C'; msg = 'Sigue practicando. Cada escucha te hace más fuerte.'; }

  const r = 54, circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);

  launchConfetti(100);

  quizArea.innerHTML = `
    <div class="results-screen">
      <div class="medal-display" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:3rem;font-weight:900;color:var(--accent);">${medal}</div>
      <div class="results-title">Quiz Completado</div>
      <div class="score-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="8"/>
          <circle cx="70" cy="70" r="${r}" fill="none"
            stroke="url(#scoreGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
            style="transition:stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)"/>
          <defs>
            <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#06b6d4"/>
              <stop offset="100%" stop-color="#00d4ff"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="score-ring-number">
          <div class="score-percent">${pct}%</div>
          <div class="score-fraction">${score} / ${questions.length}</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-block">
          <div class="stat-number">${xp}</div>
          <div class="stat-label">⭐ XP Total</div>
        </div>
        <div class="stat-block">
          <div class="stat-number">${score}</div>
          <div class="stat-label">✅ Correctas</div>
        </div>
        <div class="stat-block">
          <div class="stat-number">${questions.length - score}</div>
          <div class="stat-label">❌ Incorrectas</div>
        </div>
      </div>
      <p class="results-message">${msg}</p>
      <div class="results-buttons">
        <button class="btn-next" onclick="restartQuiz()">Reintentar</button>
        <a href="../../index.html" class="btn-retry">Catálogo</a>
      </div>
    </div>`;

  btnNext.style.display = 'none';
  document.querySelector('.timer-ring-wrap').style.display = 'none';
}

// =============================================
//  RESTART
// =============================================
function restartQuiz() {
  currentIdx = 0; score = 0; streak = 0; xp = 0; lives = 3;
  streakEl.textContent = 0; xpEl.textContent = 0;
  comboBadge.style.display = 'none';
  ['h1','h2','h3'].forEach(id => document.getElementById(id).classList.remove('lost'));
  document.querySelector('.timer-ring-wrap').style.display = 'flex';
  btnNext.style.display = 'inline-flex';
  timerFg.style.stroke = 'var(--accent)';
  renderQuestion();
}

// =============================================
//  TOAST
// =============================================
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2800);
}

// =============================================
//  CONFETTI
// =============================================
const confettiCanvas = document.getElementById('confetti-canvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiPieces = [];

function launchConfetti(count = 60) {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  const colors = ['#00d4ff','#7c3aed','#10b981','#f59e0b','#ec4899','#06b6d4'];
  for (let i = 0; i < count; i++) {
    confettiPieces.push({
      x: Math.random() * confettiCanvas.width,
      y: -10 - Math.random() * 60,
      w: 6 + Math.random() * 8,
      h: 10 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 8,
      opacity: 1
    });
  }
  animateConfetti();
}

function animateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiPieces = confettiPieces.filter(p => p.opacity > 0.02);
  confettiPieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
    p.vy += 0.08; // gravity
    if (p.y > confettiCanvas.height * 0.7) p.opacity -= 0.025;
    confettiCtx.save();
    confettiCtx.globalAlpha = p.opacity;
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rot * Math.PI / 180);
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    confettiCtx.restore();
  });
  if (confettiPieces.length > 0) requestAnimationFrame(animateConfetti);
  else confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}

// =============================================
//  PARTICLES (Background)
// =============================================
const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];

function initParticles() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
  particles = [];
  const count = Math.min(50, Math.floor(window.innerWidth / 20));
  const symbols = ['♪','♫','♩','♬','✦','·'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * pCanvas.width,
      y: Math.random() * pCanvas.height,
      sym: symbols[Math.floor(Math.random() * symbols.length)],
      size: 8 + Math.random() * 14,
      opacity: 0.04 + Math.random() * 0.08,
      vy: -0.2 - Math.random() * 0.3,
      vx: (Math.random() - 0.5) * 0.15,
      pulse: Math.random() * Math.PI * 2
    });
  }
}

function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  const t = Date.now() / 1000;
  particles.forEach(p => {
    p.y += p.vy; p.x += p.vx; p.pulse += 0.02;
    if (p.y < -30) { p.y = pCanvas.height + 10; p.x = Math.random() * pCanvas.width; }
    const alpha = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse));
    pCtx.globalAlpha = alpha;
    pCtx.fillStyle = '#00d4ff';
    pCtx.font = `${p.size}px serif`;
    pCtx.fillText(p.sym, p.x, p.y);
  });
  pCtx.globalAlpha = 1;
  requestAnimationFrame(animateParticles);
}

window.addEventListener('resize', () => { initParticles(); confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; });

// =============================================
//  INIT
// =============================================
window.addEventListener('DOMContentLoaded', () => {
  // Preload speech voices
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
  initParticles();
  animateParticles();
  renderQuestion();
});
</script>
